apiVersion: apps/v1
kind: Deployment
metadata:
  name: set13-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: set13-app
  template:
    metadata:
      labels:
        app: set13-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.26
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: set13-service
spec:
  type: NodePort
  selector:
    app: set13-app
  ports:
    - port: 80
      targetPort: 80